# Is adlari SOZLESMEDIR: "gates" ve "e2e" zorunlu status check olarak
# kullanilir. Ad degisirse branch protection sessizce bosa duser, cunku GitHub
# var olmayan bir check'i beklemez. docs/architecture.md §7
#
# Zorunlu status check'ler Faz 0 merge edildikten SONRA acilir, once degil.
# docs/working-agreement.md §3

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # RAPORLANIR, ENGELLEMEZ. Lighthouse skorlari kosucudan kosucuya oynar;
  # kapi yapilirsa flaky olur, insanlar zorla gecer, kapi oler.
  # architecture.md §8
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Serve out/ and run Lighthouse three times
        run: |
          pnpm exec serve out -l 4173 --no-clipboard &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 60000
          # Varsayilan mobil emulasyon - architecture.md §8 mobil Performance ve
          # mobil LCP raporluyor, o yuzden desktop preset'i verilmiyor.
          #
          # UC KOSU (#39): tek kosu bir olgu degil bir orneklem. Ayni sayfa uc
          # olcumde 74 ile 92 arasinda salindi, TBT 330 ile 1370ms arasinda.
          # Lighthouse CLI --runs desteklemiyor; dongu yeni bir bagimlilik
          # eklemiyor (CLAUDE.md kural 4).
          for i in 1 2 3; do
            npx --yes lighthouse http://127.0.0.1:4173 \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html \
              --output-path=./lighthouse-run-$i \
              --chrome-flags="--headless=new --no-sandbox"
          done

      # Skorlar artifact'in ICINDE kalmasin: PR'a bakan kisi indirmeden gormeli.
      - name: Summarise the three runs
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs .

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-run-*.*
          retention-days: 7
